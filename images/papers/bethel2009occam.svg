<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">Occam's razor and petascale visual data analysis</title>
  <desc id="desc">Two side-by-side scientific visualization renderings with a short caption line underneath.</desc>
  <rect width="440" height="260" fill="#ffffff"/>

  <defs>
    <linearGradient id="leftBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a56c2"/>
      <stop offset="25%" stop-color="#1eb9b0"/>
      <stop offset="50%" stop-color="#7cc04f"/>
      <stop offset="75%" stop-color="#efb332"/>
      <stop offset="100%" stop-color="#d54a1b"/>
    </linearGradient>
    <radialGradient id="sphere" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7bd0e0"/>
      <stop offset="45%" stop-color="#3a8fd3"/>
      <stop offset="75%" stop-color="#4ebf7a"/>
      <stop offset="100%" stop-color="#20326f"/>
    </radialGradient>
    <style>
      .caption { font: 600 10px 'Source Sans 3', 'Segoe UI', sans-serif; fill: #222; }
      .tiny { font: 600 8px 'Source Sans 3', 'Segoe UI', sans-serif; fill: #ddd; }
    </style>
  </defs>

  <!-- left panel -->
  <rect x="8" y="8" width="204" height="198" fill="url(#leftBg)"/>
  <g transform="translate(12 12)">
    <path d="M64,34 C98,8 150,18 174,52 C186,70 188,98 176,122 C163,149 130,168 96,167 C65,167 35,153 22,128 C8,103 8,72 25,52 C36,39 49,40 64,34 Z"
          fill="url(#heat)" opacity="0.95"/>
    <path d="M54,62 C73,42 100,40 126,49 C146,55 161,72 165,95 C169,116 160,139 144,151 C124,166 96,169 74,161 C55,153 38,139 33,119 C29,98 36,78 54,62 Z"
          fill="#34b3a0" opacity="0.95"/>
    <path d="M76,74 C96,57 122,59 138,78 C149,92 152,111 144,126 C134,146 112,158 90,154 C72,151 55,138 51,120 C47,103 56,87 76,74 Z"
          fill="#2f7ec9" opacity="0.8"/>
    <path d="M33,136 C49,133 59,139 65,153 C69,164 64,176 54,183 C44,190 28,192 18,186 C9,180 6,166 12,155 C16,146 24,139 33,136 Z"
          fill="#d45826"/>
    <path d="M139,24 C153,17 170,20 180,31 C188,40 189,53 183,63 C175,76 158,83 143,81 C130,80 118,73 113,61 C109,52 113,41 121,34 C126,30 133,27 139,24 Z"
          fill="#f0b432" opacity="0.88"/>
    <path d="M92,18 C104,13 118,15 126,24 C133,31 134,42 129,52 C122,64 108,70 95,68 C84,67 73,61 69,52 C66,45 67,35 74,28 C79,23 85,21 92,18 Z"
          fill="#8bc245" opacity="0.88"/>
  </g>

  <!-- right panel -->
  <rect x="224" y="8" width="208" height="198" fill="url(#rightBg)"/>
  <g transform="translate(228 12)">
    <ellipse cx="104" cy="95" rx="78" ry="86" fill="url(#sphere)" opacity="0.96"/>
    <path d="M58,34 C81,19 117,18 145,31 C164,39 177,54 181,71 C171,61 157,56 142,56 C119,55 102,67 86,84 C72,99 58,117 37,122 C29,124 19,124 11,122 C13,104 19,86 28,72 C35,56 45,43 58,34 Z"
          fill="#72d5be" opacity="0.42"/>
    <path d="M62,137 C84,122 117,119 146,129 C163,135 176,145 183,157 C177,171 167,182 153,190 C126,205 89,207 60,195 C42,187 28,172 20,154 C35,154 49,146 62,137 Z"
          fill="#f0b138" opacity="0.45"/>
    <path d="M101,18 C129,15 159,27 176,49 C161,45 144,48 128,56 C110,66 97,81 83,97 C72,111 60,123 43,127 C34,129 25,128 16,124 C19,105 25,88 33,73 C46,47 70,25 101,18 Z"
          fill="#5f72d1" opacity="0.34"/>
    <path d="M67,162 C85,151 108,149 130,153 C148,157 165,166 177,178 C164,192 145,201 124,205 C101,209 77,206 57,196 C44,189 33,178 26,164 C40,169 54,169 67,162 Z"
          fill="#95cf50" opacity="0.35"/>
    <g stroke="#bdbdbd" stroke-width="1.5" opacity="0.7">
      <path d="M162 168 L194 148"/>
      <path d="M147 175 L187 174"/>
      <path d="M95 182 L95 206"/>
      <path d="M95 182 L72 194"/>
      <path d="M95 182 L116 194"/>
    </g>
    <g class="tiny">
      <text x="171" y="145">10</text>
      <text x="185" y="177">-20</text>
      <text x="56" y="207">Axis (×10^6)</text>
    </g>
    <rect x="9" y="19" width="10" height="55" fill="url(#heat)" stroke="#ddd" stroke-width="0.5"/>
    <text class="tiny" x="24" y="25">Di_cation_912.bov</text>
    <text class="tiny" x="24" y="37">Cycle 0</text>
  </g>

  <!-- caption -->
  <g class="caption">
    <text x="10" y="222">(a) Isocontouring of two trillion zones on 32,000</text>
    <text x="10" y="235">Opteron cores of JaguarPF, a Cray XT5 at OLCF/ORNL.</text>
    <text x="224" y="222">(b) Volume rendering of two trillion zones on 32,000</text>
    <text x="224" y="235">Opteron cores of Franklin, a Cray XT4 at NERSC/LBNL.</text>
  </g>
</svg>
