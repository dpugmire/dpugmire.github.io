<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260" viewBox="0 0 390 260" role="img" aria-labelledby="title desc">
  <title id="title">Performance bar chart for data staging workflows</title>
  <desc id="desc">Grouped bar chart comparing Gray-Scott filesystem, SST, SSC, and PDF Analysis filesystem across five process counts.</desc>
  <rect width="390" height="260" fill="#ffffff"/>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" fill="#384860">
    <rect x="177" y="20" width="165" height="74" rx="4" fill="#ffffff" stroke="#d7dde7"/>

    <g transform="translate(192 34)">
      <rect x="0" y="0" width="16" height="8" fill="#d89a11"/>
      <text x="24" y="8" font-size="12">Gray-Scott filesystem</text>
    </g>
    <g transform="translate(192 50)">
      <rect x="0" y="0" width="16" height="8" fill="#6f1d8f"/>
      <text x="24" y="8" font-size="12">SST</text>
    </g>
    <g transform="translate(192 66)">
      <rect x="0" y="0" width="16" height="8" fill="#5c8797"/>
      <text x="24" y="8" font-size="12">SSC</text>
    </g>
    <g transform="translate(192 82)">
      <rect x="0" y="0" width="16" height="8" fill="#efe4b0"/>
      <text x="24" y="8" font-size="12">PDF Analysis filesystem</text>
    </g>
  </g>

  <g stroke="#dfe5ef" stroke-width="1">
    <line x1="52" y1="36" x2="350" y2="36"/>
    <line x1="52" y1="76" x2="350" y2="76"/>
    <line x1="52" y1="116" x2="350" y2="116"/>
    <line x1="52" y1="156" x2="350" y2="156"/>
    <line x1="52" y1="196" x2="350" y2="196"/>
  </g>

  <g stroke="#4a5d73" stroke-width="1.4">
    <line x1="52" y1="36" x2="52" y2="196"/>
    <line x1="52" y1="196" x2="350" y2="196"/>
  </g>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="12" fill="#4a5d73">
    <text x="44" y="200" text-anchor="end">0</text>
    <text x="44" y="160" text-anchor="end">500</text>
    <text x="44" y="120" text-anchor="end">1000</text>
    <text x="44" y="80" text-anchor="end">1500</text>
    <text x="44" y="40" text-anchor="end">2000</text>
    <text x="196" y="238" text-anchor="middle" font-size="13">Number of Gray-Scott processes</text>
  </g>

  <text x="17" y="122" transform="rotate(-90 17 122)" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#4a5d73">
    End-to-end execution time [s]
  </text>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="12" fill="#4a5d73">
    <text x="86" y="216" text-anchor="middle">256</text>
    <text x="141" y="216" text-anchor="middle">512</text>
    <text x="196" y="216" text-anchor="middle">1024</text>
    <text x="251" y="216" text-anchor="middle">2048</text>
    <text x="306" y="216" text-anchor="middle">4096</text>
  </g>

  <g>
    <!-- 256 -->
    <rect x="64" y="42" width="13" height="154" fill="#d89a11"/>
    <rect x="78" y="62" width="13" height="134" fill="#6f1d8f"/>
    <rect x="92" y="64" width="13" height="132" fill="#5c8797"/>
    <rect x="106" y="174" width="13" height="22" fill="#efe4b0"/>

    <!-- 512 -->
    <rect x="119" y="102" width="13" height="94" fill="#d89a11"/>
    <rect x="133" y="124" width="13" height="72" fill="#6f1d8f"/>
    <rect x="147" y="124" width="13" height="72" fill="#5c8797"/>
    <rect x="161" y="171" width="13" height="25" fill="#efe4b0"/>

    <!-- 1024 -->
    <rect x="174" y="132" width="13" height="64" fill="#d89a11"/>
    <rect x="188" y="154" width="13" height="42" fill="#6f1d8f"/>
    <rect x="202" y="156" width="13" height="40" fill="#5c8797"/>
    <rect x="216" y="170" width="13" height="26" fill="#efe4b0"/>

    <!-- 2048 -->
    <rect x="229" y="156" width="13" height="40" fill="#d89a11"/>
    <rect x="243" y="177" width="13" height="19" fill="#6f1d8f"/>
    <rect x="257" y="177" width="13" height="19" fill="#5c8797"/>
    <rect x="271" y="171" width="13" height="25" fill="#efe4b0"/>

    <!-- 4096 -->
    <rect x="284" y="164" width="13" height="32" fill="#d89a11"/>
    <rect x="298" y="178" width="13" height="18" fill="#6f1d8f"/>
    <rect x="312" y="181" width="13" height="15" fill="#5c8797"/>
    <rect x="326" y="173" width="13" height="23" fill="#efe4b0"/>
  </g>
</svg>
