<svg xmlns="http://www.w3.org/2000/svg" width="620" height="395" viewBox="0 0 620 395" role="img" aria-labelledby="title desc">
  <title id="title">Data refactoring workflow and MGARD compression performance charts</title>
  <desc id="desc">Four-panel figure showing write and read workflow timing as coefficient classes increase, plus CPU and GPU MGARD compression and decompression timing across error bounds.</desc>
