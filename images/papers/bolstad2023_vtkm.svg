<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">VTK-m architecture overview</title>
  <desc id="desc">Diagram showing VTK-m visualization filters over multiple hardware backends.</desc>
  <rect width="520" height="220" fill="#ffffff"/>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">
    <!-- top feature buttons -->
    <g fill="#0e84c7">
      <rect x="58" y="20" width="95" height="22" rx="2"/>
      <rect x="163" y="20" width="95" height="22" rx="2"/>
      <rect x="268" y="20" width="95" height="22" rx="2"/>
      <rect x="373" y="20" width="95" height="22" rx="2"/>

      <rect x="10" y="48" width="95" height="22" rx="2"/>
      <rect x="115" y="48" width="95" height="22" rx="2"/>
      <rect x="220" y="48" width="115" height="22" rx="2"/>
      <rect x="345" y="48" width="95" height="22" rx="2"/>
      <rect x="450" y="48" width="60" height="22" rx="2"/>
    </g>

    <g font-size="11" fill="#ffffff">
      <text x="106" y="35">Contour</text>
      <text x="211" y="35">Streams</text>
      <text x="316" y="35">Clip</text>
      <text x="421" y="35">Render</text>

      <text x="57" y="63">Surface</text>
      <text x="162" y="63">Normals</text>
      <text x="277" y="63">Ghost Cells</text>
      <text x="392" y="63">Warp</text>
      <text x="480" y="63">...</text>
    </g>
  </g>

  <!-- connections to center -->
  <g fill="none" stroke="#6a6a6a" stroke-width="2.2" stroke-linecap="round">
    <path d="M 106 42 C 106 72, 205 82, 260 108"/>
    <path d="M 211 42 C 211 74, 228 84, 260 108"/>
    <path d="M 316 42 C 316 74, 292 84, 260 108"/>
    <path d="M 421 42 C 421 72, 316 82, 260 108"/>

    <path d="M 57 70 C 57 95, 185 88, 260 108"/>
    <path d="M 162 70 C 162 92, 215 90, 260 108"/>
    <path d="M 277 70 C 277 88, 270 92, 260 108"/>
    <path d="M 392 70 C 392 92, 315 90, 260 108"/>
    <path d="M 480 70 C 480 96, 340 88, 260 108"/>
  </g>

  <!-- center logo box -->
  <rect x="208" y="84" width="104" height="42" rx="2" fill="#ffffff" stroke="#c9cdd4"/>
  <text x="260" y="113" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="28" font-style="italic" font-weight="700" text-anchor="middle" fill="#1a5a8f">VTK-m</text>

  <!-- lower connections -->
  <g fill="none" stroke="#7a7a7a" stroke-width="2.4" stroke-linecap="round">
    <path d="M 260 126 C 260 150, 145 136, 62 172"/>
    <path d="M 260 126 C 260 152, 195 136, 166 172"/>
    <path d="M 260 126 C 260 156, 238 138, 270 172"/>
    <path d="M 260 126 C 260 152, 327 136, 374 172"/>
    <path d="M 260 126 C 260 150, 381 136, 478 172"/>
  </g>

  <!-- bottom backend boxes -->
  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">
    <g fill="#b31d02">
      <rect x="12" y="156" width="90" height="22" rx="2"/>
      <rect x="116" y="156" width="90" height="22" rx="2"/>
      <rect x="220" y="156" width="90" height="22" rx="2"/>
      <rect x="324" y="156" width="90" height="22" rx="2"/>
      <rect x="428" y="156" width="82" height="22" rx="2"/>
    </g>
    <g font-size="11" fill="#ffffff">
      <text x="57" y="171">x86</text>
      <text x="161" y="171">CUDA</text>
      <text x="265" y="171">Xeon Phi</text>
      <text x="369" y="171">AMD ROCm</text>
      <text x="469" y="171">Intel GPU</text>
    </g>
  </g>

  <!-- underline -->
  <path d="M 14 182 H 412" fill="none" stroke="#0e84c7" stroke-width="4" stroke-linecap="round"/>

  <text x="214" y="210" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#4a4a4a">Demonstrated</text>
</svg>
