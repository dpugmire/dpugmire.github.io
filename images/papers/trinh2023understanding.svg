<svg xmlns="http://www.w3.org/2000/svg" width="300" height="235" viewBox="0 0 300 235" role="img" aria-labelledby="title desc">
  <title id="title">Random source selection diameter chart</title>
  <desc id="desc">Line chart comparing RandomSourceSelection and First X Nodes diameter versus job size on a log-scaled x-axis.</desc>
  <rect width="300" height="235" fill="#ffffff"/>

  <rect x="28" y="20" width="244" height="166" fill="#ffffff" stroke="#b8c2cf"/>

  <g stroke="#e5e9f0" stroke-width="1">
    <line x1="36" y1="45" x2="265" y2="45"/>
    <line x1="36" y1="75" x2="265" y2="75"/>
    <line x1="36" y1="105" x2="265" y2="105"/>
    <line x1="36" y1="135" x2="265" y2="135"/>
    <line x1="36" y1="165" x2="265" y2="165"/>
  </g>

  <g stroke="#4f5f73" stroke-width="1.4">
    <line x1="36" y1="26" x2="36" y2="186"/>
    <line x1="36" y1="186" x2="265" y2="186"/>
  </g>

  <text x="150" y="15" text-anchor="middle" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="11" fill="#333">
    Random Source Selection Diameter
  </text>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="10" fill="#4f5f73">
    <text x="23" y="189" text-anchor="end">0</text>
    <text x="23" y="159" text-anchor="end">10</text>
    <text x="23" y="129" text-anchor="end">20</text>
    <text x="23" y="99" text-anchor="end">30</text>
  </g>

  <g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="10" fill="#4f5f73" text-anchor="middle">
    <text x="92" y="199">10<tspan baseline-shift="super" font-size="8">1</tspan></text>
    <text x="155" y="199">10<tspan baseline-shift="super" font-size="8">2</tspan></text>
    <text x="218" y="199">10<tspan baseline-shift="super" font-size="8">3</tspan></text>
    <text x="258" y="199">10<tspan baseline-shift="super" font-size="8">4</tspan></text>
    <text x="149" y="216" font-size="11">Job Size</text>
  </g>

  <text x="14" y="113" transform="rotate(-90 14 113)" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="11" fill="#4f5f73">
    Diameter
  </text>

  <polyline
    points="46,180 58,170 68,160 76,150 84,146 92,140 100,136 108,132 116,126 124,125 132,116 140,114 148,118 156,110 164,116 172,98 180,105 188,92 196,102 204,78 212,92 220,66 228,72 236,44 244,42 252,44 260,120"
    fill="none"
    stroke="#1f77b4"
    stroke-width="2"
  />

  <polyline
    points="46,176 58,168 68,156 76,144 84,128 92,118 100,130 108,104 116,120 124,88 132,102 140,76 148,94 156,66 164,86 172,52 180,84 188,48 196,88 204,36 212,64 220,30 228,34 236,32 244,32 252,34 260,56"
    fill="none"
    stroke="#2ca02c"
    stroke-width="2"
  />

  <g opacity="0.45" stroke-width="1">
    <path d="M 72 178 L 72 74" stroke="#1f77b4"/>
    <path d="M 78 176 L 78 66" stroke="#2ca02c"/>
    <path d="M 108 182 L 108 86" stroke="#1f77b4"/>
    <path d="M 114 182 L 114 58" stroke="#2ca02c"/>
    <path d="M 144 182 L 144 76" stroke="#1f77b4"/>
    <path d="M 150 182 L 150 54" stroke="#2ca02c"/>
    <path d="M 186 182 L 186 64" stroke="#1f77b4"/>
    <path d="M 192 182 L 192 42" stroke="#2ca02c"/>
    <path d="M 228 182 L 228 42" stroke="#1f77b4"/>
    <path d="M 234 182 L 234 28" stroke="#2ca02c"/>
  </g>

  <g transform="translate(140 146)" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="10">
    <rect x="0" y="0" width="110" height="34" fill="#ffffff" stroke="#d7dde7"/>
    <line x1="8" y1="11" x2="24" y2="11" stroke="#1f77b4" stroke-width="2"/>
    <text x="30" y="14" fill="#4f5f73">RandomSourceSelection</text>
    <line x1="8" y1="24" x2="24" y2="24" stroke="#2ca02c" stroke-width="2"/>
    <text x="30" y="27" fill="#4f5f73">First X Nodes</text>
  </g>
</svg>
