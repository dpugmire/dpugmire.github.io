name: Validate Site Data

on:
  push:
    paths:
      - "data/**"
      - "cv/**"
      - "index.html"
      - "scripts/validate_site_data.py"
      - ".github/workflows/update.yml"
  pull_request:
    paths:
      - "data/**"
      - "cv/**"
      - "index.html"
      - "scripts/validate_site_data.py"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install PyYAML

      - name: Validate data
        run: python scripts/validate_site_data.py

      - name: Generate CV LaTeX
        run: python cv/generate_cv.py
