  # CONFERENCE - 2025
  - id: "wang2025orbit"
    title: "ORBIT-2: Scaling Exascale Vision Foundation Models for Weather and Climate Downscaling"
    authors: "Wang, X., Choi, J., Kurihaya, T., Lyngaas, I., Yoon, H., Xiao, X., Pugmire, D., Fan, M., Nafi, N., Tsaris, A., Aji, A., Hossain, M., Wahib, M., Wang, D., Thornton, P., Balaprakash, P., Ashfaq, M., Lu, D."
    venue: "Proceedings of the International Conference for High Performance Computing, Networking, Storage and Analysis"
    year: 2025
    type: conference # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/3712285.3771989"
    paper_url: "https://doi.org/10.1145/3712285.3771989"
    abstract: 'Sparse observations and coarse-resolution climate models limit effective regional decision-making, underscoring the need for robust downscaling. However, existing AI methods struggle with generalization across variables and geographies and are constrained by the quadratic complexity of Vision Transformer (ViT) self-attention. We introduce ORBIT-2, a scalable foundation model for global, hyper-resolution climate downscaling. ORBIT-2 incorporates two key innovations: (1) Residual Slim ViT (Reslim), a lightweight architecture with residual learning and Bayesian regularization for efficient, robust prediction; and (2) TILES, a tile-wise sequence scaling algorithm that reduces self-attention complexity from quadratic to linear, enabling long-sequence processing and massive parallelism. ORBIT-2 scales to 10 billion parameters across 65,536 GPUs, achieving up to 4.1 ExaFLOPS sustained throughput and 74–98\% strong scaling efficiency. It supports downscaling to 0.9 km global resolution and processes sequences up to 4.2 billion tokens. On 7 km resolution benchmarks, ORBIT-2 achieves high accuracy with R2 scores in range of 0.98–0.99 against observation data.'
    note: "Best Paper Award"
    # summary: ""  # Add a one-sentence summary of the paper
    image: "wang2025orbit.png" # Optional - add image file to images/papers/

  # CONFERENCE - 2016
  - id: "larsen2016"
    title: "Performance Modeling of In Situ Rendering"
    authors: "M. Larsen, C. Harrison, J. Kress, D. Pugmire, J. S. Meredith and H. Childs"
    venue: "Proceedings of the International Conference for High Performance Computing, Networking, Storage and Analysis"
    year: 2016
    type: conference # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1109/SC.2016.23"
    paper_url: "https://doi.org/10.1109/SC.2016.23"
    abstract: "With the push to exascale, in situ visualization and analysis will continue to play an important role in high performance computing. Tightly coupling in situ visualization with simulations constrains resources for both, and these constraints force a complex balance of trade-offs. A performance model that provides an a priori answer for the cost of using an in situ approach for a given task would assist in managing the trade-offs between simulation and visualization resources. In this work, we present new statistical performance models, based on algorithmic complexity, that accurately predict the run-time cost of a set of representative rendering algorithms, an essential in situ visualization task. To train and validate the models, we conduct a performance study of an MPI+X rendering infrastructure used in situ with three HPC simulation applications. We then explore feasibility issues using the model for selected in situ rendering questions."
    note: "Best Paper Award Finalist"
