  # JOURNAL - 2016
  - id: "bozda2016global"
    title: "Global adjoint tomography: first-generation model"
    authors: "Bozdağ, E., Peter, D., Lefebvre, M., Komatitsch, D., Tromp, J., Hill, J., Podhorszki, N., Pugmire, D."
    venue: "Geophysical Journal International"
    year: 2016
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1093/gji/ggw356"
    paper_url: "https://doi.org/10.1093/gji/ggw356"
    abstract: "We present the first-generation global tomographic model constructed based on adjoint tomography, an iterative full-waveform inversion technique. Synthetic seismograms were calculated using GPU-accelerated spectral-element simulations of global seismic wave propagation, accommodating effects due to 3-D anelastic crust &amp; mantle structure, topography &amp; bathymetry, the ocean load, ellipticity, rotation, and self-gravitation. Fréchet derivatives were calculated in 3-D anelastic models based on an adjoint-state method. The simulations were performed on the Cray XK7 named ‘Titan’, a computer with 18 688 GPU accelerators housed at Oak Ridge National Laboratory. The transversely isotropic global model is the result of 15 tomographic iterations, which systematically reduced differences between observed and simulated three-component seismograms. Our starting model combined 3-D mantle model S362ANI with 3-D crustal model Crust2.0. We simultaneously inverted for structure in the crust and mantle, thereby eliminating the need for widely used ‘crustal corrections’. We used data from 253 earthquakes in the magnitude range 5.8 ≤ M w ≤ 7.0. We started inversions by combining ∼30 s body-wave data with ∼60 s surface-wave data. The shortest period of the surface waves was gradually decreased, and in the last three iterations we combined ∼17 s body waves with ∼45 s surface waves. We started using 180 min long seismograms after the 12th iteration and assimilated minor- and major-arc body and surface waves. The 15th iteration model features enhancements of well-known slabs, an enhanced image of the Samoa/Tahiti plume, as well as various other plumes and hotspots, such as Caroline, Galapagos, Yellowstone and Erebus. Furthermore, we see clear improvements in slab resolution along the Hellenic and Japan Arcs, as well as subduction along the East of Scotia Plate, which does not exist in the starting model. Point-spread function tests demonstrate that we are approaching the resolution of continental-scale studies in some areas, for example, underneath Yellowstone. This is a consequence of our multiscale smoothing strategy in which we define our smoothing operator as a function of the approximate Hessian kernel, thereby smoothing gradients less wherever we have good ray coverage, such as underneath North America."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper
    image: "specfem3d.jpg" # Optional - add image file to images/papers/

  # JOURNAL - 2016
  - id: "kress2016preparing"
    title: "Preparing for In Situ Processing on Upcoming Leading-edge Supercomputers"
    authors: "Kress, J., Churchill, R., Klasky, S., Kim, M., Childs, H., Pugmire, D."
    venue: "Supercomputing frontiers and innovations"
    year: 2016
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.14529/jsfi160404"
    paper_url: "https://www.osti.gov/biblio/1338570"
    abstract: "High performance computing applications are producing increasingly large amounts of data and placing enormous stress on current capabilities for traditional post-hoc visualization techniques. Because of the growing compute and I/O imbalance, data reductions, including in situ visualization, are required. These reduced data are used for analysis and visualization in a variety of different ways. Many of he visualization and analysis requirements are known a priori, but when they are not, scientists are dependent on the reduced data to accurately represent the simulation in post hoc analysis. The contributions of this paper is a description of the directions we are pursuing to assist a large scale fusion simulation code succeed on the next generation of supercomputers. Finally, these directions include the role of in situ processing for performing data reductions, as well as the tradeoffs between data size and data integrity within the context of complex operations in a typical scientific workflow."
