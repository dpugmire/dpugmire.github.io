  # WORKSHOP - 2017
  - id: "kim2017situ"
    title: "In Situ Visualization of Radiation Transport Geometry"
    authors: "Kim, M., Evans, T., Klasky, S., Pugmire, D."
    venue: "Proceedings of the In Situ Infrastructures on Enabling Extreme-Scale Analysis and Visualization"
    year: 2017
    type: workshop # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/3144769.3144770"
    paper_url: "https://doi.org/10.1145/3144769.3144770"
    abstract: 'The ultimate goal for radiation transport is to perform full-core reactor modelling and simulation. Advances in computational simulation bring this goal close to reality and the newest Monte Carlo transport codes have begun to shift to using accelerators that have become a stalwart in the supercomputing and HPC space. Within the reactor modelling and simulation community, Monte Carlo transport simulations are considered the gold standard for simulation. Through the use of "combinatorial geometry" (constructive solid geomtry), complex models can be used with fewer approximation compromises while at the same time scale to run on some of the largest supercomputers in the world.Unfortunately, the state-of-the-art for "combinatorial geometry" visualization is to decompose the geometry into a mesh. This approach could require a significant amount of memory which is antithetical to in situ visualization. To address this issue, we introduce a ray caster for visualizing combinatorial geometry in radiation transport code. By only using the accelerators for the radiation transport code and leaving the CPU cores idle, there is an opportunity to conduct on node in situ visualization with the idle CPU cores, something domain experts have up to this point been unable to do. By utilizing VTK-m, the visualization can be run on the CPU as this particular application demands, but also run on any architecture that is supported by VTK-m, enabling future re-use across different platforms.'
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper
    # image: 'kim2017situ.jpg'  # Optional - add image file to images/papers/

  # CONFERENCE - 2017
  - id: "pugmire2017pillars"
    title: "Pillars of the Mantle: Imaging the Interior of the Earth with Adjoint Tomography"
    authors: 'Pugmire, D., Bozda\ug, E., Lefebvre, M., Tromp, J., Komatitsch, D., Peter, D., Podhorszki, N., Hill, J.'
    venue: "Practice and Experience in Advanced Research Computing 2017: Sustainability, Success and Impact"
    year: 2017
    type: conference # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/3093338.3104170"
    paper_url: "https://doi.org/10.1145/3093338.3104170"
    abstract: "In this work, we investigate global seismic tomographic models obtained by spectral-element simulations of seismic wave propagation and adjoint methods. Global crustal and mantle models are obtained based on an iterative conjugate-gradient type of optimization scheme. Forward and adjoint seismic wave propagation simulations, which result in synthetic seismic data to make measurements and data sensitivity kernels to compute gradient for model updates, respectively, are performed by the SPECFEM3D_GLOBE package [1] [2] at the Oak Ridge Leadership Computing Facility (OLCF) to study the structure of the Earth at unprecedented levels. Using advances in solver techniques that run on the GPUs on Titan at the OLCF, scientists are able to perform large-scale seismic inverse modeling and imaging. Using seismic data from global and regional networks from global CMT earthquakes, scientists are using SPECFEM3D_GLOBE to understand the structure of the mantle layer of the Earth. Visualization of the generated data sets provide an effective way to understand the computed wave perturbations which define the structure of mantle in the Earth."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper
