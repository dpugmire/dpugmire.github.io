    title: "The Importance of Scientific Visualization on Novel Hardware"
    authors: "Moreland, K., Pugmire, D., Geveci, B., Lo, L., Childs, H., Bolstad, M., Shah, R., Wu, P."
    venue: "Oak Ridge National Laboratory (ORNL), Oak Ridge, TN (United States)"
