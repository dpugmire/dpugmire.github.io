  # WORKSHOP - 2015
  - id: "kress2015loosely"
    title: "Loosely Coupled In Situ Visualization: A Perspective on Why It's Here to Stay"
    authors: "Kress, J., Klasky, S., Podhorszki, N., Choi, J., Childs, H., Pugmire, D."
    venue: "Proceedings of the First Workshop on In Situ Infrastructures for Enabling Extreme-Scale Analysis and Visualization"
    year: 2015
    type: workshop # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/2828612.2828623"
    paper_url: "https://doi.org/10.1145/2828612.2828623"
    abstract: "In this position paper, we argue that the loosely coupled in situ processing paradigm will play an important role in high performance computing for the foreseeable future. Loosely coupled in situ is an enabling technique that addresses many of the current issues with tightly coupled in situ, including, ease-of-integration, usability, and fault tolerance. We survey the prominent positives and negatives of both tightly coupled and loosely coupled in situ and present our recommendation as to why loosely coupled in situ is an enabling technique that is here to stay. We then report on some recent experiences with loosely coupled in situ processing, in an effort to explore each of the discussed factors in a real-world environment."
