  # JOURNAL - 2024
  - id: "moreland2024visualization"
    title: "Visualization at exascale: Making it all work with VTK-m"
    authors: "Moreland, K., Athawale, T., Bolea, V., Bolstad, M., Brugger, E., Childs, H., Huebl, A., Lo, L., Geveci, B., Marsaglia, N., Philip, S., Pugmire, D., Rizzi, S., Wang, Z., Yenpure, A."
    venue: "The International Journal of High Performance Computing Applications"
    year: 2024
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1177/10943420241270969"
    paper_url: "https://doi.org/10.1177/10943420241270969"
    image: "moreland2024visualization.jpg" # Optional - add image file to images/papers/
    abstract: "The VTK-m software library enables scientific visualization on exascale-class supercomputers. Exascale machines are particularly challenging for software development in part because they use GPU accelerators to provide the vast majority of their computational throughput. Algorithmic designs for GPUs and GPU-centric computing often deviate from those that worked well on previous generations of high-performance computers that relied on traditional CPUs. Fortunately, VTK-m provides scientific visualization algorithms for GPUs and other accelerators. VTK-m also provides a framework that simplifies the implementation of new algorithms and adds a porting layer to work across multiple processor types. This paper describes the main challenges encountered when making scientific visualization available at exascale. We document the surprises and obstacles faced when moving from pre-exascale platforms to the final exascale designs and the performance on those systems including scaling studies on Frontier, an exascale machine with over 37,000 AMD GPUs. We also report on the integration of VTK-m with other exascale software technologies. Finally, we show how VTK-m helps scientific discovery for applications such as fusion and particle acceleration that leverage an exascale supercomputer."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper

  # JOURNAL - 2023
  - id: "anirudh2023review"
    title: "2022 Review of Data-Driven Plasma Science"
    authors: "Anirudh, R., Archibald, R., Asif, M., Becker, M., Benkadda, S., Bremer, P., Budé, R., Chang, C., Chen, L., Churchill, R., Citrin, J., Gaffney, J., Gainaru, A., Gekelman, W., Gibbs, T., Hamaguchi, S., Hill, C., Humbird, K., Jalas, S., Kawaguchi, S., et al."
    venue: "IEEE Transactions on Plasma Science"
    year: 2023
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1109/tps.2023.3268170"
    paper_url: "https://doi.org/10.1109/tps.2023.3268170"
    abstract: "Data-driven science and technology offer transformative tools and methods to science. This review article highlights the latest development and progress in the interdisciplinary field of data-driven plasma science (DDPS), i.e., plasma science whose progress is driven strongly by data and data analyses. Plasma is considered to be the most ubiquitous form of observable matter in the universe. Data associated with plasmas can, therefore, cover extremely large spatial and temporal scales, and often provide essential information for other scientific disciplines. Thanks to the latest technological developments, plasma experiments, observations, and computation now produce a large amount of data that can no longer be analyzed or interpreted manually. This trend now necessitates a highly sophisticated use of high-performance computers for data analyses, making artificial intelligence and machine learning vital components of DDPS. This article contains seven primary sections, in addition to the introduction and summary. Following an overview of fundamental data-driven science, five other sections cover widely studied topics of plasma science and technologies, i.e., basic plasma physics and laboratory experiments, magnetic confinement fusion, inertial confinement fusion and high-energy-density physics, space and astronomical plasmas, and plasma technologies for industrial and other applications. The final section before the summary discusses plasma-related databases that could significantly contribute to DDPS. Each primary section starts with a brief introduction to the topic, discusses the state-of-the-art developments in the use of data and/or data-scientific approaches, and presents the summary and outlook. Despite the recent impressive signs of progress, the DDPS is still in its infancy. This article attempts to offer a broad perspective on the development of this field and identify where further innovations are required."
    note: "Best Paper Award"
