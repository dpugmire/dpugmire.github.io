  - id: "bethel2009occam"
    title: "Occam's razor and petascale visual data analysis"
    authors: "Bethel, E. W., Johnson, C., Ahern, S., Bell, J., Bremer, P.-T., Childs, H., Cormier-Michel, E., Day, M., Deines, E., Fogal, T., Garth, C., Geddes, C. G. R., Hagen, H., Hamann, B., Hansen, C., Jacobsen, J., Joy, K., Krüger, J., Meredith, J., Messmer, P., Ostrouchov, G., Pascucci, V., Potter, K., Prabhat, Pugmire, D., Rübel, O., Sanderson, A., Silva, C., Ushizima, D., Weber, G., Whitlock, B., Wu, K."
    venue: "Journal of Physics: Conference Series"
    year: 2009
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1088/1742-6596/180/1/012084"
    paper_url: "https://iopscience.iop.org/article/10.1088/1742-6596/180/1/012084"
    abstract: "One of the central challenges facing visualization research is how to effectively enable knowledge discovery. An effective approach will likely combine application architectures that are capable of running on today's largest platforms to address the challenges posed by large data with visual data analysis techniques that help find, represent, and effectively convey scientifically interesting features and phenomena."
