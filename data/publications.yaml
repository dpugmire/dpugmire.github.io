  # CONFERENCE - 2018
  - id: "pugmire2018performance"
    title: "Performance-Portable Particle Advection with VTK-m"
    authors: "Pugmire, D., Yenpure, A., Kim, M., Kress, J., Maynard, R., Childs, H., Hentschel, B."
    venue: "Eurographics Symposium on Parallel Graphics and Visualization (EGPGV)"
    year: 2018
    type: conference # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.2312/pgv.20181094"
    paper_url: "https://www.osti.gov/biblio/1558503"
    abstract: "Particle advection is the fundamental kernel behind most vector field visualization methods. Yet, the efficient parallel computation of large amounts of particle traces remains challenging. This is exacerbated by the variety of hardware trends in today's HPC arena, including increasing core counts in classical CPUs, many-core designs such as the Intel Xeon Phi, and massively parallel GPUs. The dedicated optimization of a particle advection kernel for each individual target architecture is both time-consuming and error prone. In this paper, we propose a performance-portable algorithm for particle advection. Our algorithm is based on the recently introduced VTK-m system and chiefly relies on its device adapter abstraction. We demonstrate the general portability of our implementation across a wide variety of hardware. Finally, our evaluation shows that our hardware-agnostic algorithm has comparable performance to hardware-specific algorithms."
    note: "Best Paper Award Finalist"
