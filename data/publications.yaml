  # WORKSHOP - 2022
  - id: "pugmire2022need"
    title: "The Need for Pervasive In Situ Analysis and Visualization (P-ISAV)"
    authors: "Pugmire, D., Huang, J., Moreland, K., Klasky, S."
    venue: "High Performance Computing. ISC High Performance 2022 International Workshops"
