  # WORKSHOP - 2018
  - id: "kim2018situ"
    title: "In Situ Analysis and Visualization of Fusion Simulations: Lessons Learned"
    authors: "Kim, M."
    venue: "High Performance Computing"
    year: 2018
    type: workshop # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1007/978-3-030-02465-9_16"
    paper_url: "https://doi.org/10.1007/978-3-030-02465-9_16"
    abstract: "The trends in high performance computing, where far more data can be computed that can ever be stored, have made in situ techniques an important area of research and development. Simulation campaigns, where domain scientists work with computer scientists to run a simulation and perform in situ analysis and visualization are important, and complex undertakings. In this paper we report our experiences performing in situ analysis and visualization on two campaigns. The two campaigns were related, but had important differences in terms of the codes that were used, the types of analysis and visualization required, and the visualization tools used. Further, we report the lessons learned from each campaign."
