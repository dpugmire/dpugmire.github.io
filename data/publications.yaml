    abstract: "The computational work to perform particle advection-based flow visualization techniques varies based on many factors, including number of particles, duration, and mesh type. In many cases, the total work is significant, and total execution time (performance) is a critical issue. This state-of-the-art report considers existing optimizations for particle advection, using two high-level categories: algorithmic optimizations and hardware efficiency. The sub-categories for algorithmic optimizations include solvers, cell locators, I/O efficiency, and precomputation, while the sub-categories for hardware efficiency all involve parallelism: shared-memory, distributed-memory, and hybrid. Finally, this STAR concludes by identifying current gaps in our understanding of particle advection performance and its optimizations."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper

  # CONFERENCE - 2023
  - id: "senapati2023advancing"
    title: "Advancing Comprehension of Quantum Application Outputs: A Visualization Technique"
    authors: "Senapati, P., Athawale, T., Pugmire, D., Guan, Q."
    venue: "Proceedings of the 2023 International Workshop on Quantum Classical Cooperative"
    year: 2023
    type: workshop # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/3588983.3596689"
    paper_url: "https://doi.org/10.1145/3588983.3596689"
    image: "senapati2023advancing.jpg" # Optional - add image file to images/papers/
    abstract: "Noise in quantum computers presents a challenge for the users of quantum computing despite the rapid progress we have seen in the past few years in building quantum computers. Existing works have addressed the noise in quantum computers using a variety of mitigation techniques since error correction requires a large number of qubits which is infeasible at present. One of the consequences of quantum computing noise is that users are unable to reproduce similar output from the same quantum computer at different times, let alone from various quantum computers. In this work, we have made initial attempts to visualize quantum basis states for all the circuits that were used in quantum machine learning from various quantum computers and noise-free quantum simulators. We have opened up a pathway for further research into this field where we will be able to isolate noisy states from non-noisy states leading to efficient error mitigation. This is where our work provides an important step in the direction of efficient error mitigation. Our work also provides a ground for quantum noise visualization in the case of large numbers of qubits."
