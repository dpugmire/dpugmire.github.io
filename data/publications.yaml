  # JOURNAL - 2024
  - id: "cui2024glad"
    title: "GLAD-M35: a joint P and S global tomographic model with uncertainty quantification"
    authors: "Cui, C., Lei, W., Liu, Q., Peter, D., Bozdağ, E., Tromp, J., Hill, J., Podhorszki, N., Pugmire, D."
    venue: "Geophysical Journal International"
    year: 2024
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1093/gji/ggae270"
    paper_url: "https://doi.org/10.1093/gji/ggae270"
    abstract: "We present our third and final generation joint P and S global adjoint tomography (GLAD) model, GLAD-M35, and quantify its uncertainty based on a low-rank approximation of the inverse Hessian. Starting from our second-generation model, GLAD-M25, we added 680 new earthquakes to the database for a total of 2160 events. New P-wave categories are included to compensate for the imbalance between P- and S-wave measurements, and we enhanced the window selection algorithm to include more major-arc phases, providing better constraints on the structure of the deep mantle and more than doubling the number of measurement windows to 40 million. Two stages of a Broyden–Fletcher–Goldfarb–Shanno (BFGS) quasi-Newton inversion were performed, each comprising five iterations. With this BFGS update history, we determine the model’s standard deviation and resolution length through randomized singular value decomposition."
    # note: ""  # e.g., Best Paper Award
