  # JOURNAL - 2020
  - id: "logan2020extending"
    title: "Extending the Publish/Subscribe Abstraction for High-Performance I/O and Data Management at Extreme Scale"
    authors: "Logan, J., Ainsworth, M., Atkins, C., Chen, J., Choi, J., Gu, J., Kress, J., Eisenhauer, G., Geveci, B., Godoy, W., others"
    venue: "Bulletin of the IEEE Technical Committee on Data Engineering"
    year: 2020
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.22215/etd/2003-05586"
    paper_url: "https://www.osti.gov/biblio/1606642"
    abstract: "The Adaptable I/O System (ADIOS) represents the culmination of substantial investment in Scientific Data Management, and it has demonstrated success for several important extreme-scale science cases. However, looking towards the exascale and beyond, we see the development of yet more stringent data management requirements that require new abstractions. Therefore, there is an opportunity to attempt to connect the traditional realms of HPC I/O optimization with the Database / Data Management community. As such, in this paper we offer some specific examples from our ongoing work in managing data structures, services, and performance at the extreme scale for scientific computing. Using the publish/subscribe model afforded by ADIOS, we demonstrate a set of services that connect data format, metadata, queries, data reduction, and high-performance delivery. The resulting publish/subscribe framework facilitates connection to on-line workflow systems to enable the dynamic capabilities that will be required for exascale science."
