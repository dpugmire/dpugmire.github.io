  # CONFERENCE - 2012
  - id: "meredith2012distributed"
    title: "A Distributed Data-Parallel Framework for Analysis and Visualization Algorithm Development"
    authors: "Meredith, J., Sisneros, R., Pugmire, D., Ahern, S."
    venue: "Proceedings of the 5th Annual Workshop on General Purpose Processing with Graphics Processing Units"
    year: 2012
    type: conference # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1145/2159430.2159432"
    paper_url: "https://doi.org/10.1145/2159430.2159432"
    abstract: "The coming generation of supercomputing architectures will require fundamental changes in programming models to effectively make use of the expected million to billion way concurrency and thousand-fold reduction in per-core memory. Most current parallel analysis and visualization tools achieve scalability by partitioning the data, either spatially or temporally, and running serial computational kernels on each data partition, using message passing as needed. These techniques lack the necessary level of data parallelism to execute effectively on the underlying hardware. This paper introduces a framework that enables the expression of analysis and visualization algorithms with memory-efficient execution in a hybrid distributed and data parallel manner on both multi-core and many-core processors. We demonstrate results on scientific data using CPUs and GPUs in scalable heterogeneous systems."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper
    # image: 'meredith2012distributed.jpg'  # Optional - add image file to images/papers/

  # JOURNAL - 2012
  - id: "sutter2012examination"
    title: "An examination of magnetized outflows from active galactic nuclei in galaxy clusters"
    authors: "Sutter, P., Yang, H., Ricker, P., Foreman, G., Pugmire, D."
    venue: "Monthly Notices of the Royal Astronomical Society"
    year: 2012
    type: journal # journal, conference, workshop, techreport, abstract, book-chapter, preprint, other
    doi: "10.1111/j.1365-2966.2011.19875.x"
    paper_url: "https://doi.org/10.1111/j.1365-2966.2011.19875.x"
    abstract: "We present 3D adaptive mesh refinement magnetohydrodynamic (MHD) simulations of an isolated galaxy cluster that include injection of kinetic, thermal and magnetic energy via a central active galactic nucleus (AGN) in order to study and evaluate the role that AGN may play in producing the observed cluster-wide magnetic fields. Using the MHD solver in flash 3.3, we compare several subresolution approaches to the evolution of AGN, specifically focusing on large-scale jet and bubble models. We examine the effects of magnetized outflows on the accretion history of the black hole and cluster thermodynamic properties, discuss the ability of various models to magnetize the cluster medium, and assess the sensitivity of these models to their underlying subgrid parameters. We find that magnetized jet-based models suffer a severe reduction in accretion rate compared to hydrodynamic jets; however, bubble models remain largely unaffected. While both jets and sporadically placed bubbles have difficulty reproducing the observed strength and topology of cluster magnetic fields, models based on centrally located bubbles come closest to observations. Finally, whereas jet models are relatively insensitive to changes in their subgrid parameters, the accretion rate and average magnetic field produced by the bubbles vary by as much as an order of magnitude depending on the grid resolution and accretion strength."
    # note: ""  # e.g., Best Paper Award
    # summary: ""  # Add a one-sentence summary of the paper
    image: "sutter2011examination.png"

