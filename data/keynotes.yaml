# Keynotes
# lat/lon are used to place pins on the Leaflet world map in the Talks section.

talks:
  - title: "Keynote Title"
    venue: "Conference / Event"
    city: "City, ST"
    country: "USA"
    date: "2024-01-01"
    lat: 0.0
    lon: 0.0
    slides: "keynote.pdf"

